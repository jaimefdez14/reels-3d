name: preparar
description: Node, Chromium de Playwright, ffmpeg, Python con numpy/soundfile y, si se pide, Kokoro con sus modelos.
inputs:
  kokoro: { description: 'instalar Kokoro (previas)', default: 'false' }
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: '22' }
    - uses: actions/setup-python@v5
      with: { python-version: '3.12' }
    - name: ffmpeg y dependencias
      shell: bash
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
        npm ci --no-audit --no-fund
        npm i --no-save --no-audit --no-fund playwright@1.63.0
        pip install -q numpy soundfile
    - uses: actions/cache@v4
      with: { path: ~/.cache/ms-playwright, key: pw-1.63.0 }
    - name: Chromium
      shell: bash
      run: npx playwright install --with-deps chromium
    - name: Kokoro
      if: inputs.kokoro == 'true'
      shell: bash
      run: pip install -q kokoro-onnx==0.6.1
    - uses: actions/cache@v4
      if: inputs.kokoro == 'true'
      with: { path: ~/.cache/hyperframes/tts, key: kokoro-v1.0 }
    - name: Modelos de Kokoro
      if: inputs.kokoro == 'true'
      shell: bash
      run: |
        d=~/.cache/hyperframes/tts; mkdir -p $d/models $d/voices
        u=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
        [ -s $d/models/kokoro-v1.0.onnx ] || curl -sSfL $u/kokoro-v1.0.onnx -o $d/models/kokoro-v1.0.onnx
        [ -s $d/voices/voices-v1.0.bin ] || curl -sSfL $u/voices-v1.0.bin -o $d/voices/voices-v1.0.bin
