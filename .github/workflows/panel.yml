# Publica el panel (panel/index.html) en GitHub Pages: https://jaimefdez14.github.io/reels-3d/
# El panel lee docs/panel.json (lo escribe pipeline.py en cada paso) y manda las órdenes como comentarios en las issues.
# Requisito, una vez: Settings → Pages → Source: «GitHub Actions».
name: panel
on:
  push:
    branches: [main]
    paths: ['panel/**']
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: panel }
      - id: d
        uses: actions/deploy-pages@v4
